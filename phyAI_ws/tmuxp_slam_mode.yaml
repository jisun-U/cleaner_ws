session_name: cleaner_ws
windows:
  - window_name: bringup
    layout: tiled
    panes:
        - shell_command:
            - cd ~/cleaner_ws/phyAI_ws
            - source /opt/ros/humble/setup.bash
            - source install/setup.bash
            - ros2 launch nav2_bringup slam_launch.py use_sim_time:=true slam:=true params_file:='~/cleaner_ws/phyAI_ws/config_slam,nav2/nav2_slam_only.yaml'
        - shell_command:
            - cd ~/cleaner_ws/phyAI_ws
            - source /opt/ros/humble/setup.bash
            - source install/setup.bash
            - ros2 launch nav2_bringup navigation_launch.py use_sim_time:=true params_file:='~/cleaner_ws/phyAI_ws/config_slam,nav2/nav2_slam_only.yaml'
        - shell_command:
            - cd ~/cleaner_ws/phyAI_ws
            - source /opt/ros/humble/setup.bash
            - rviz2 -d cleaner_proj.rviz --ros-args -p use_sim_time:=true
