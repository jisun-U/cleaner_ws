slam_toolbox:
  ros__parameters:
    use_sim_time: true # /clock topic
    
    # frame
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: scan 
    
    # 오도메트리/TF
    use_odometry: true
    provide_odom_frame: true
    publish_tf: true
    
    # TF/시간 버퍼/대기
    tf_buffer_duration: 30.0 
    transform_timeout: 1.0 
    
    # 메세지 필터 큐(드랍 방지)
    queue_size: 100
    
    # 스캔 특성/부하 완화
    resolution: 0.05 #1픽셀당 5cm
    max_laser_range: 20.0 #라이다 최대 반경 20m
    minimum_range: 0.3 #0.3m 이내의 데이터는 무시 / 로봇 몸체가 찍혀 지도 망침
    throttle_scans: 1 #라이다 스캔 데이터 들어올때, 2번에 1번 꼴로 스킵함
    
    # (옵션)use_scan_matching