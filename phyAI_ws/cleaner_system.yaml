session_name: cleaner_system
start_directory: /home/sunny/cleaner_ws/phyAI_ws

windows:
  - window_name: yolov8
    panes:
      - shell_command:
          - source /opt/ros/humble/setup.bash
          - export ROS_DOMAIN_ID=21
          - source /home/sunny/cleaner_ws/phyAI_ws/install/setup.bash
          - ros2 launch yolov8_bringup yolov8.launch.py input_image_topic:=/yolo/image_raw

  - window_name: vision_context
    panes:
      - shell_command:
          - source /opt/ros/humble/setup.bash
          - export ROS_DOMAIN_ID=21
          - source /home/sunny/cleaner_ws/phyAI_ws/install/setup.bash
          - ros2 run vision_context_builder vision_context_builder_node --ros-args -p depth_topic:=/depth

  - window_name: system1
    panes:
      - shell_command:
          - source /opt/ros/humble/setup.bash
          - export ROS_DOMAIN_ID=21
          - source /home/sunny/cleaner_ws/phyAI_ws/install/setup.bash
          - ros2 run cleaner_system1 system1_executor_node

  # - window_name: system2
  #   panes:
  #     - shell_command:
  #         - source /opt/ros/humble/setup.bash
  #         - export ROS_DOMAIN_ID=21
  #         - source /home/sunny/cleaner_ws/phyAI_ws/install/setup.bash
  #         - ros2 run cleaner_system2 system2_node

  - window_name: isaac
    panes:
      - shell_command:
          - source /opt/ros/humble/setup.bash
          - export ROS_DOMAIN_ID=21
          - source ~/anaconda3/etc/profile.d/conda.sh
          - conda activate env_isaaclab
          - ~/isaac-sim/python.sh /home/sunny/cleaner_ws/cleaner_IsaacSim/Main/main.py
          
  - window_name: nav2
    panes:
      - shell_command:
          - source /opt/ros/humble/setup.bash
          - export ROS_DOMAIN_ID=21
          - sleep 20
          - ros2 launch nav2_bringup bringup_launch.py use_sim_time:=true map:=/home/sunny/cleaner_ws/phyAI_ws/map/may15_v2_revised.yaml params_file:=/home/sunny/cleaner_ws/phyAI_ws/nav2_localization_params.yaml

  - window_name: rviz
    panes:
      - shell_command:
          - source /opt/ros/humble/setup.bash
          - export ROS_DOMAIN_ID=21
          - rviz2 -d /home/sunny/cleaner_ws/phyAI_ws/cleaner_proj.rviz
